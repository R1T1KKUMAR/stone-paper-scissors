<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">First to 5 wins!</p>
    <div class="scoreboard" aria-live="polite">
      <div class="score">
        <h2>Player</h2>
        <p id="player-score">0</p>
      </div>
      <div class="score">
        <h2>Computer</h2>
        <p id="computer-score">0</p>
      </div>
    </div>
    <div class="choices">
      <div class="choice">
        <h3>You</h3>
        <div id="player-selection" role="img" aria-label="Your selection: none yet">❔</div>
      </div>
      <div class="choice">
        <h3>Computer</h3>
        <div id="computer-selection" role="img" aria-label="Computer selection: none yet">❔</div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn" id="rock" aria-label="Choose rock">🪨 Rock</button>
      <button class="btn" id="paper" aria-label="Choose paper">📄 Paper</button>
      <button class="btn" id="scissors" aria-label="Choose scissors">✂️ Scissors</button>
    </div>
    <p class="result" aria-live="polite">Make your move!</p>
    <button class="reset-btn" id="reset">🔁 Reset Game</button>
  </main>

  <div class="winner-popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="winner-text" hidden>
    <div class="popup-content">
      <h2 id="winner-text"></h2>
      <button id="play-again">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
